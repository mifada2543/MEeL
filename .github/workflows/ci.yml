name: MEeL CI

on:
  push:
    branches: [ "main", "master", "develop", "Experiment" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Enable debug logging'
        required: false
        default: false
        type: boolean

# ─── Concurrency: cancel redundant runs on the same branch ───
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─── Least privilege for GITHUB_TOKEN ───
permissions:
  contents: read
  checks: write
  pull-requests: write

# ─── Defaults ───
defaults:
  run:
    shell: bash

jobs:
  # ─── Job 1: PHP Syntax Check ───
  php-syntax:
    name: PHP Syntax (php -l)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: none

      - name: PHP Syntax Check (php -l)
        run: |
          failed=0
          count=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" 2>&1; then
              echo "❌ Syntax error in: $file"
              failed=1
            fi
            count=$((count + 1))
          done < <(find . -name '*.php' -not -path './vendor/*' -not -path './.git/*' -not -path './assets/dict/*' -print0)
          if [ $failed -eq 1 ]; then exit 1; fi
          echo "✅ All $count PHP files passed syntax check on PHP ${{ matrix.php-version }}."

  # ─── Job 2: Functional Tests ───
  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: php-syntax
    if: always()  # Run even if syntax check fails on some PHP versions
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: none

      - name: Run Functional Tests
        run: |
          if [ -f tests/functional_test.php ]; then
            # Catat rc via || (bukan baris terpisah) karena run: di GitHub Actions
            # berjalan dengan `bash -e` — perintah yang return 1 langsung menghentikan
            # shell sebelum rc=$? sempat dieksekusi; || membuatnya exempt dari set -e.
            rc=0
            php tests/functional_test.php || rc=$?
            # 1 = lulus dengan peringatan (storage/HDD belum ter-mount, dll.) → tetap hijau
            if [ "$rc" -gt 1 ]; then exit "$rc"; fi
            if [ "$rc" -eq 1 ]; then echo "⚠️  Functional test passed with warnings (exit 1)"; fi
          else
            echo "⚠️  Functional test not found, skipping."
          fi

  # ─── Job 3: Security Tests ───
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: php-syntax
    if: always()
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: none

      - name: Run Security Tests
        run: |
          if [ -f tests/security_test.php ]; then
            # Catat rc via || (bukan baris terpisah) karena run: di GitHub Actions
            # berjalan dengan `bash -e` — perintah yang return 1 langsung menghentikan
            # shell sebelum rc=$? sempat dieksekusi; || membuatnya exempt dari set -e.
            rc=0
            php tests/security_test.php || rc=$?
            # 1 = lulus dengan peringatan (storage/HDD belum ter-mount, dll.) → tetap hijau
            if [ "$rc" -gt 1 ]; then exit "$rc"; fi
            if [ "$rc" -eq 1 ]; then echo "⚠️  Security test passed with warnings (exit 1)"; fi
          else
            echo "⚠️  Security test not found, skipping."
          fi

  # ─── Job 4: PHPUnit Tests ───
  phpunit-tests:
    name: PHPUnit Unit Tests
    runs-on: ubuntu-latest
    needs: php-syntax
    if: always()
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: |
          if [ -f composer.json ]; then
            composer install --no-progress --no-interaction --prefer-dist
          else
            echo "⚠️  composer.json not found, skipping."
          fi

      - name: Run PHPUnit Tests
        run: |
          if [ -f vendor/bin/phpunit ]; then
            php vendor/bin/phpunit --no-coverage --verbose
          else
            echo "⚠️  PHPUnit not installed, skipping."
          fi

  # ─── Job 5: HTACCESS & Integrity Check ───
  htaccess-check:
    name: HTACCESS & Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check HTACCESS Protection
        run: |
          echo "🔍 Checking sensitive directories have .htaccess protection..."
          sensitive_dirs=(
            "controllers" "modules" "logs" "tests" "database"
            "auth" "err" "temp" "data_drive" "books/upload"
            "music/upload" "video/upload" "drive/templates"
            "docs/partials" "partials" "admin" "scripts"
          )
          missing=0
          for dir in "${sensitive_dirs[@]}"; do
            if [ -d "$dir" ] && [ ! -f "$dir/.htaccess" ]; then
              echo "❌ Missing .htaccess in: $dir/"
              missing=1
            fi
          done
          if [ $missing -eq 1 ]; then exit 1; fi
          echo "✅ All ${#sensitive_dirs[@]} sensitive directories have .htaccess protection."

      - name: Check Critical File Permissions
        run: |
          echo "🔍 Checking critical file permissions..."
          critical_scripts=(
            "auth/config.php" "auth/auth.php" "auth/login.php"
            "auth/register.php" "auth/logout.php"
            "index.php" ".htaccess"
          )
          issues=0
          for file in "${critical_scripts[@]}"; do
            if [ -f "$file" ]; then
              perms=$(stat -c "%a" "$file")
              if [ "$perms" != "644" ] && [ "$perms" != "755" ] && [ "$perms" != "750" ]; then
                echo "⚠️  Unusual permissions ($perms) on: $file"
              fi
            else
              echo "ℹ️  $file not found (may not be required)"
            fi
          done
          echo "✅ Permission check complete."

  # ─── Job 6: Deployment Check ───
  # Menjalankan tests/check_deploy.php — verifikasi lingkungan deployment
  # (MEEL_HDD_BASE, upload symlinks, .htaccess hardening, PWA mod_rewrite,
  # dan validating forward proxy SSRF). Di runner, storage lokal (book/music/
  # video upload) disimulasikan ke $RUNNER_TEMP karena symlink yang ter-track
  # di repo menunjuk ke path /media yang tidak ada. data_drive/public &
  # data_drive/private_admins kini folder nyata ter-track (bukan symlink) dan
  # modul Drive membaca storage langsung dari MEEL_HDD_DRIVE.
  # Argumen --hdd meniru MEEL_HDD_BASE (lihat check_deploy.php --help).
  deploy-check:
    name: Deployment Check
    runs-on: ubuntu-latest
    needs: php-syntax
    if: always()
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: none

      - name: Simulate storage layout (temp HDD + upload dirs)
        run: |
          # check_deploy memverifikasi MEEL_HDD_BASE, upload symlinks dan
          # .htaccess upload dirs. Runner tidak punya /media storage, jadi kita
          # buat layout tiruan yang valid di $RUNNER_TEMP lalu arahkan symlink
          # upload ke sana (check_deploy memeriksa target symlink).
          #
          # Asumsi: books/music/video/upload adalah symlink yang ter-track git
          # (mode 120000) menuju /media/... yang TIDAK ada di runner — rm -f
          # menghapus symlink-nya saja (bukan target), lalu ln -s membuat
          # symlink baru ke storage temp.
          #
          # Catatan: data_drive/public & data_drive/private_admins TIDAK lagi
          # symlink ter-track — keduanya folder nyata di repo (placeholder
          # .gitkeep/.htaccess deny ter-track). Modul Drive membaca storage
          # langsung dari MEEL_HDD_DRIVE (disimulasikan lewat --hdd), jadi
          # tidak ada symlink yang perlu diarahkan ke temp untuk Drive.
          HDD="$RUNNER_TEMP/meel_storage/media"
          mkdir -p "$HDD/video/upload/video" "$HDD/video/upload/thumbnail" \
                   "$HDD/music/upload" "$HDD/books/upload" \
                   "$HDD/drive/private_admins"

          # .htaccess hardening untuk tiap upload dir (pola sama dengan deploy)
          for m in video music books; do
            cp "${{ github.workspace }}/data_drive/.htaccess" "$HDD/$m/upload/.htaccess" 2>/dev/null || true
            # Upload dir di repo adalah symlink → arahkan ke storage temp
            rm -f "${{ github.workspace }}/$m/upload"
            ln -s "$HDD/$m/upload" "${{ github.workspace }}/$m/upload"
          done

          # settings.php dibutuhkan check_deploy (di-copy dari contoh)
          cp "${{ github.workspace }}/auth/settings.example.php" "${{ github.workspace }}/auth/settings.php" 2>/dev/null || true

          echo "HDD=$HDD" >> "$GITHUB_ENV"

      - name: Run Deployment Check
        run: |
          if [ -f tests/check_deploy.php ]; then
            php tests/check_deploy.php --no-color --hdd="$HDD" || exit $?
          else
            echo "⚠️  Deployment check not found, skipping."
          fi

      - name: Verify Private Drive 403 (staging)
        # Optional: hanya berjalan bila STAGING_URL tersedia sebagai secret.
        # Memastikan web server sungguhan menolak akses langsung ke
        # data_drive/private_admins/ (lihat docs/en/test.md). secrets context
        # tersedia langsung di if — empty secret = step di-skip.
        if: secrets.STAGING_URL != ''
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$STAGING_URL/data_drive/private_admins/" || true)
          [ "$code" = "403" ] || { echo "Expected 403, got $code"; exit 1; }
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}

  # ─── Job 6b: Drive Storage Integrity — tolak symlink di data_drive/ ───
  # data_drive/public & data_drive/private_admins harus folder NYATA di repo
  # (placeholder .gitkeep/.htaccess deny ter-track). Symlink ter-track yang
  # menunjuk ke path absolut development (/media/<username>/...) membocorkan
  # username OS lewat repo publik dan membuat modul Drive crash di mesin lain
  # (RuntimeException: Folder penyimpanan gagal dibuat). Job ini menolak PR
  # bila ada symlink apa pun di dalam data_drive/.
  drive-storage-check:
    name: Drive Storage Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reject symlinks inside data_drive/
        run: |
          echo "🔍 Memeriksa data_drive/public & data_drive/private_admins (harus folder nyata)..."
          # 1) Index check: mode 120000 = symlink ter-track. Git index adalah
          #    sumber kebenaran apa yang akan ter-commit — bukan sekadar
          #    working tree.
          tracked=$(git ls-files -s data_drive/ | awk '$1 == "120000" {print $4}')
          if [ -n "$tracked" ]; then
            echo "❌ Symlink ter-track di data_drive/ (dilarang):"
            echo "$tracked" | sed 's/^/   - /'
            echo ""
            echo "Perbaikan: hapus symlink; untuk storage eksternal set MEEL_HDD_DRIVE"
            echo "di auth/settings.php (modul Drive membaca langsung, tanpa symlink)."
            exit 1
          fi
          # 2) Working-tree check: symlink yang muncul di filesystem (mis. hasil
          #    deploy lokal yang keliru di-commit via -f).
          found=0
          while IFS= read -r -d '' link; do
            echo "❌ Symlink di data_drive/: $link -> $(readlink "$link")"
            found=1
          done < <(find data_drive -type l -print0)
          [ $found -eq 1 ] && exit 1
          echo "✅ Tidak ada symlink di data_drive/ (index & working tree bersih)."

  # ─── Job 7: Summary / Status ───
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [php-syntax, functional-tests, security-tests, phpunit-tests, htaccess-check, deploy-check, drive-storage-check]
    if: always()
    steps:
      - name: Generate Job Status Summary
        run: |
          echo "## 📊 CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY

          report_job() {
            local name="$1"
            local result="$2"
            if [ "$result" == "success" ]; then
              echo "| ✅ $name | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            elif [ "$result" == "cancelled" ]; then
              echo "| ⏭️  $name | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| ❌ $name | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          }

          report_job "PHP Syntax (8.1)" "${{ needs.php-syntax.result }}"
          report_job "PHP Syntax (8.2)" "${{ needs.php-syntax.result }}"
          report_job "PHP Syntax (8.3)" "${{ needs.php-syntax.result }}"
          report_job "Functional Tests" "${{ needs.functional-tests.result }}"
          report_job "Security Tests" "${{ needs.security-tests.result }}"
          report_job "PHPUnit Unit Tests" "${{ needs.phpunit-tests.result }}"
          report_job "HTACCESS & Integrity" "${{ needs.htaccess-check.result }}"
          report_job "Deployment Check" "${{ needs.deploy-check.result }}"
          report_job "Drive Storage Integrity" "${{ needs.drive-storage-check.result }}"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚡ Optimizations applied" >> $GITHUB_STEP_SUMMARY
          echo "- **Parallel jobs** — syntax check, tests, security, and integrity run in parallel" >> $GITHUB_STEP_SUMMARY
          echo "- **Matrix strategy** — syntax check across PHP 8.1, 8.2, 8.3" >> $GITHUB_STEP_SUMMARY
          echo "- **Shallow clone** — `fetch-depth: 1` for faster checkout" >> $GITHUB_STEP_SUMMARY
          echo "- **Concurrency** — cancels redundant runs on the same branch" >> $GITHUB_STEP_SUMMARY
          echo "- **Xdebug disabled** — `coverage: none` for faster PHP execution" >> $GITHUB_STEP_SUMMARY
          echo "- **Least privilege** — minimal `GITHUB_TOKEN` permissions" >> $GITHUB_STEP_SUMMARY
          echo "- **Fail-fast disabled** — all PHP versions run even if one fails" >> $GITHUB_STEP_SUMMARY
          echo "- **Job dependency** — functional/security tests wait for syntax check" >> $GITHUB_STEP_SUMMARY
