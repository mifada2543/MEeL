<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Tetris">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1e1b2e"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="200" r="150" fill="#a855f7" opacity="0.08"/>
  <g stroke="#0b0e14" stroke-width="3">
    <!-- I (cyan) -->
    <rect x="210" y="90" width="34" height="34" fill="#00e5ff"/>
    <rect x="246" y="90" width="34" height="34" fill="#00e5ff"/>
    <rect x="282" y="90" width="34" height="34" fill="#00e5ff"/>
    <rect x="318" y="90" width="34" height="34" fill="#00e5ff"/>
    <!-- T (purple) -->
    <rect x="380" y="90" width="34" height="34" fill="#b388ff"/>
    <rect x="416" y="90" width="34" height="34" fill="#b388ff"/>
    <rect x="452" y="90" width="34" height="34" fill="#b388ff"/>
    <rect x="416" y="126" width="34" height="34" fill="#b388ff"/>
    <!-- Z (red) -->
    <rect x="150" y="140" width="34" height="34" fill="#ff8a80"/>
    <rect x="186" y="140" width="34" height="34" fill="#ff8a80"/>
    <rect x="186" y="176" width="34" height="34" fill="#ff8a80"/>
    <rect x="222" y="176" width="34" height="34" fill="#ff8a80"/>
    <!-- L (orange) -->
    <rect x="500" y="126" width="34" height="34" fill="#ffab40"/>
    <rect x="500" y="162" width="34" height="34" fill="#ffab40"/>
    <rect x="534" y="162" width="34" height="34" fill="#ffab40"/>
    <rect x="568" y="162" width="34" height="34" fill="#ffab40"/>
    <!-- O (yellow) -->
    <rect x="330" y="176" width="34" height="34" fill="#ffe066"/>
    <rect x="366" y="176" width="34" height="34" fill="#ffe066"/>
    <rect x="330" y="212" width="34" height="34" fill="#ffe066"/>
    <rect x="366" y="212" width="34" height="34" fill="#ffe066"/>
    <!-- S (green) -->
    <rect x="560" y="90" width="34" height="34" fill="#69f0ae"/>
    <rect x="594" y="90" width="34" height="34" fill="#69f0ae"/>
    <rect x="594" y="126" width="34" height="34" fill="#69f0ae"/>
    <rect x="628" y="126" width="34" height="34" fill="#69f0ae"/>
    <!-- J (blue) -->
    <rect x="220" y="212" width="34" height="34" fill="#82b1ff"/>
    <rect x="220" y="248" width="34" height="34" fill="#82b1ff"/>
    <rect x="254" y="248" width="34" height="34" fill="#82b1ff"/>
    <rect x="288" y="248" width="34" height="34" fill="#82b1ff"/>
  </g>
  <text x="400" y="380" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" text-anchor="middle" fill="url(#title)">TETRIS</text>
  <text x="400" y="420" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="6" text-anchor="middle" fill="#6d6a80">MEeL ARCADE</text>
</svg>
