<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="note1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>
  <!-- Lane lines -->
  <line x1="50" y1="30" x2="50" y2="170" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="83" y1="30" x2="83" y2="170" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="117" y1="30" x2="117" y2="170" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="150" y1="30" x2="150" y2="170" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <!-- Hit line -->
  <line x1="30" y1="145" x2="170" y2="145" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Notes falling -->
  <rect x="35" y="45" width="30" height="12" rx="5" fill="#ec4899"/>
  <rect x="68" y="70" width="30" height="12" rx="5" fill="#a855f7"/>
  <rect x="102" y="55" width="30" height="12" rx="5" fill="#6366f1"/>
  <rect x="135" y="85" width="30" height="12" rx="5" fill="#818cf8"/>
  <rect x="52" y="105" width="30" height="12" rx="5" fill="#ec4899"/>
  <rect x="118" y="115" width="30" height="12" rx="5" fill="#a855f7"/>
  <!-- Perfect hit burst -->
  <circle cx="100" cy="145" r="8" fill="rgba(251,191,36,0.5)"/>
  <circle cx="100" cy="145" r="4" fill="#fbbf24"/>
  <!-- Key labels -->
  <text x="50" y="188" font-family="monospace" font-size="11" font-weight="bold" fill="rgba(255,255,255,0.7)" text-anchor="middle">A</text>
  <text x="83" y="188" font-family="monospace" font-size="11" font-weight="bold" fill="rgba(255,255,255,0.7)" text-anchor="middle">S</text>
  <text x="117" y="188" font-family="monospace" font-size="11" font-weight="bold" fill="rgba(255,255,255,0.7)" text-anchor="middle">K</text>
  <text x="150" y="188" font-family="monospace" font-size="11" font-weight="bold" fill="rgba(255,255,255,0.7)" text-anchor="middle">L</text>
</svg>
